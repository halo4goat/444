<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry4Fun</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0b0b0c; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; position: relative; }
        .version-tag { position: absolute; top: 20px; left: 20px; font-size: 0.95rem; font-weight: bold; color: #ff3366; letter-spacing: 0.5px; background-color: #16161a; padding: 6px 14px; border-radius: 6px; border: 1px solid #24242b; }
        .credit-tag { position: absolute; top: 20px; right: 20px; font-size: 0.95rem; font-weight: bold; color: #00ffcc; letter-spacing: 0.5px; background-color: #16161a; padding: 6px 14px; border-radius: 6px; border: 1px solid #24242b; }
        h1 { margin-bottom: 15px; font-weight: 600; letter-spacing: 1px;}
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; width: 100%; max-width: 1200px; margin: 0 auto; }
        .card { background-color: #16161a; border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #24242b; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 24px rgba(0, 255, 204, 0.25); border-color: #00ffcc; }
        .card img { width: 100%; height: 280px; object-fit: cover; border-radius: 8px; background-color: #010101; }
        .card h3 { margin: 12px 0 3px 0; font-size: 1.05rem; font-weight: 600; color: #f0f0f0; }
    </style>
</head>
<body>

    <div class="version-tag">v2.11</div>
    <div class="credit-tag">Made by halo4goat</div>

    <h1>Chemistry4Fun</h1>

    <div class="grid">
        <div class="card" onclick="cloakGame('https://math.wales', 'Bloxd.io')">
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAgAAAAIABAMAAAAGVsnJAAAABGdBTUEAALGPC/xhBQAAAAFzUkdCAK7OHOkAAAAJcEhZcwAACxMAAAsTAQCanBgAAAASUExURb58Xtyddvj7+0QvHSYmKF9TyiLlCzcA" alt="Bloxd.io">
            <h3>Bloxd.io</h3>
        </div>
        <div class="card" onclick="cloakGame('https://veck.io', 'Veck.io')">
            <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxITEhUSEhMVFRUVFRUVFRUVFxYXFRUVFRUWFxYVFRUYHSggGBolHRUVITEhJSorLi4uFx8zODMsNygtLisBCgoKDg0OGhAQGi0lHSUtLS0tKy0tLS0=" alt="Veck.io">
            <h3>Veck.io</h3>
        </div>
        <div class="card" onclick="cloakGame('https://genizymath.github.io/iframe/262.html', 'Half-Life 1', true)">
            <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxMTEhUTExMVFhUXGBoXGBgYGBcXGBoaFxgXGBgYGBgYHSggGBolHRcXITEhJSkrLi4uFx8zODMtNygtLisBCgoKDg0OGxAQGy0lICYvLS0tLS0tLS0=" alt="Half-Life 1">
            <h3>Half-Life 1</h3>
        </div>
        <div class="card" onclick="cloakGame('https://skribbl.io', 'Skribbl.io')">
            <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5OjcBCgoKDQwNGg8PGjclHyU3Nzc3Nzc3Nzc=" alt="Skribbl.io">
            <h3>Skribbl.io</h3>
        </div>
        <div class="card" onclick="cloakGame('https://wings.io', 'Wings.io')">
            <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxIQEBAQEBAQDxAVEBAQDxAQFxAQEBAVFRUWFhYVFRUYHSggGBolGxUVITEhJSkrLi4uFx8zODMtNygtLisBCgoKDg0OGhAQGi0lHyUtLS0tLS0tLS0=" alt="Wings.io">
            <h3>Wings.io</h3>
        </div>
        <div class="card" onclick="cloakGame('https://diep.io', 'Diep.io')">
            <img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBwkICAsICAoQCAgICBYJCAgICBsICQoKIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6IyszOD84NzQ5OjcBCgoKDg0OGhAQGi0eFSUtKzcrLSs3Ky0=" alt="Diep.io">
            <h3>Diep.io</h3>
        </div>
       <div class="card" onclick="cloakGame('https://orbitbeats.github.io', 'Orbit Beats')">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 280 280'%3E%3Crect fill='%231a1a2e' width='280' height='280'/%3E%3Ccircle cx='140' cy='140' r='80' fill='%2300ffcc'/%3E%3Ccircle cx='140' cy='140' r='60' fill='%231a1a2e'/%3E%3Ccircle cx='140' cy='100' r='8' fill='%2300ffcc'/%3E%3Ccircle cx='170' cy='140' r='8' fill='%2300ffcc'/%3E%3Ccircle cx='140' cy='180' r='8' fill='%2300ffcc'/%3E%3Ccircle cx='110' cy='140' r='8' fill='%2300ffcc'/%3E%3C/svg%3E" alt="Orbit Beats">
        </div>
    </div>

    <script>
        function openOrbitBeats() {
            window.location.href = 'https://orbitbeats.github.io';
        }

        function cloakGame(url, title, openFullscreen) {
            let popup = window.open('about:blank', '_blank');

            if (!popup) {
                alert('Please allow popups!');
                return;
            }

            let iframeUrl = url;

            try {
                iframeUrl = new URL(url, window.location.href).href;
            } catch (error) {
                iframeUrl = url;
            }

            popup.document.open();
            popup.document.write('<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>New Tab</title><style>html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;width:100%}iframe{width:100%;height:100%;border:none;display:block;}</style></head><body></body></html>');
            popup.document.close();

            let iframe = popup.document.createElement('iframe');
            iframe.src = iframeUrl;
            iframe.allow = 'autoplay; fullscreen; gamepad; pointer-lock';
            iframe.setAttribute('allowfullscreen', '');
            iframe.allowFullscreen = true;
            popup.document.body.appendChild(iframe);

            popup.document.title = 'Chemistry Experiment - ' + title;

            let link = popup.document.createElement('link');
            link.rel = 'icon';
            link.type = 'image/svg+xml';
            link.href = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E";
            popup.document.head.appendChild(link);

            if (openFullscreen) {
                requestPopupFullscreen(popup, iframe);
            }
        }

        function requestPopupFullscreen(popup, target) {
            let request = target.requestFullscreen ||
                target.webkitRequestFullscreen ||
                target.mozRequestFullScreen ||
                target.msRequestFullscreen;

            try {
                let result = request ? request.call(target) : null;

                if (result && typeof result.catch === 'function') {
                    result.catch(function () {
                        addFullscreenFallback(popup, target);
                    });
                } else if (!request) {
                    addFullscreenFallback(popup, target);
                }
            } catch (error) {
                addFullscreenFallback(popup, target);
            }
        }

        function addFullscreenFallback(popup, target) {
            let button = popup.document.createElement('button');
            button.textContent = 'Fullscreen';
            button.style.position = 'fixed';
            button.style.right = '14px';
            button.style.bottom = '14px';
            button.style.zIndex = '20';
            button.style.padding = '10px 14px';
            button.style.border = '0';
            button.style.borderRadius = '6px';
            button.style.background = '#00ffcc';
            button.style.color = '#121212';
            button.style.fontWeight = '700';
            button.style.cursor = 'pointer';
            button.onclick = function () {
                requestPopupFullscreen(popup, target);
                button.remove();
            };
            popup.document.body.appendChild(button);
        }
    </script>
</body>
</html>
