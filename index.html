<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry4Fun</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
    <style>
        /* Modernized CSS with variables for easy theming */
        :root {
            --bg-color: #0b0b0c;
            --card-bg: #16161a;
            --border-color: #24242b;
            --text-main: #ffffff;
            --accent-pink: #ff3366;
            --accent-cyan: #00ffcc;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            min-height: 100vh;
        }

        /* Tag layout improvements to prevent overlapping on small screens */
        .tags-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            position: absolute;
            top: 20px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .tag {
            font-size: 0.95rem; 
            font-weight: bold; 
            letter-spacing: 0.5px; 
            background-color: var(--card-bg); 
            padding: 6px 14px; 
            border-radius: 6px; 
            border: 1px solid var(--border-color); 
        }

        .version-tag { color: var(--accent-pink); }
        .credit-tag { color: var(--accent-cyan); }

        h1 { 
            margin-top: 60px;
            margin-bottom: 25px; 
            font-weight: 600; 
            letter-spacing: 1px;
        }

        /* Responsive grid */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
            width: 100%; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* Smoother hover effects */
        .card { 
            background-color: var(--card-bg); 
            border-radius: 12px; 
            padding: 12px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            border: 1px solid var(--border-color); 
            display: flex;
            flex-direction: column;
        }

        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 24px rgba(0, 255, 204, 0.25); 
            border-color: var(--accent-cyan); 
        }

        /* Responsive images */
        .card img { 
            width: 100%; 
            aspect-ratio: 16/9;
            object-fit: cover; 
            border-radius: 8px; 
            background-color: #010101; 
        }

        .card h3 { 
            margin: 12px 0 3px 0; 
            font-size: 1.05rem; 
            font-weight: 600; 
            color: #f0f0f0; 
        }
    </style>
</head>

<!DOCTYPE html>

            position: relative; 
        }

        .version-tag {

            padding: 12px; 
            text-align: center;
